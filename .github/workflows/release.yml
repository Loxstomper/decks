name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag must not ship a red build. Reuses ci.yml verbatim rather than
  # re-listing the checks, so the two can never drift.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser creates the GitHub Release
    steps:
      # Pinned to immutable commit SHAs; see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full history and tags to build the changelog.
          fetch-depth: 0
          # GoReleaser talks to the API with GITHUB_TOKEN below; it never pushes
          # over git, so the checkout does not need credentials left on disk.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The .goreleaser.yaml `before` hooks run `npm ci` and `npm run build`:
      # the binary embeds web/dist, and without it every archive would ship a
      # binary that aborts with web.ErrNotBuilt.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # An exact CLI version, not "~> v2": that range would silently pull a
          # newer GoReleaser into a release build.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
