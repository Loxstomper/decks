name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag can never ship without a green suite.
  workflow_call:

permissions:
  contents: read

# Every third-party action is pinned to an immutable commit SHA, not a tag.
# A tag is a movable pointer: `actions/checkout@v4` can be repointed at new code
# by anyone who can push a tag to that repo, which is exactly how the
# tj-actions/changed-files compromise executed. The trailing comment records the
# human-readable version so Dependabot can bump both together.
#
# persist-credentials: false stops actions/checkout leaving a GITHUB_TOKEN in
# .git/config, where any dependency's build script could read it.

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # web/dist is gitignored; only the .gitkeep placeholder is committed, which is
      # enough for //go:embed to compile. The frontend is not needed to run Go tests.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd/ internal/ web/)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs strictly from package-lock.json, which pins every one of
      # the 271 packages by exact version + integrity hash. Never `npm install` here:
      # it may resolve new versions and rewrite the lockfile.
      #
      # Not --ignore-scripts: esbuild needs its install script to fetch a platform
      # binary, and the vite build fails without it.
      - run: npm ci
      # svelte-check, not tsc: bare tsc cannot resolve types exported from
      # <script module> in .svelte files and reports phantom errors.
      - run: npm run check
      - run: npx vitest run

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # gitleaks scans history, not just the tip: a secret committed and later
          # deleted is still in the objects, and still published.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # setup-go exports GOTOOLCHAIN=local, so `go run` cannot fetch a newer
          # toolchain on demand: go.mod's floor must stay >= the `go` directive of
          # the gitleaks version pinned below (v8.30.1 wants 1.24.11), or this job
          # dies with "requires go >= X (running go Y)".
          go-version-file: go.mod
          cache: true

      # `go run <module>@<version>` rather than a marketplace action: one less
      # third-party action to trust.
      #
      # A Go version tag is NOT a mutable pointer the way an Action tag is.
      # v8.30.1 resolves to an immutable content hash, proxy.golang.org caches the
      # original zip, and sum.golang.org is an append-only transparency log; a
      # repointed upstream tag fails with "SECURITY ERROR: checksum mismatch".
      # Pinning @<commit-sha> would yield a pseudo-version through the same check
      # -- more opaque, no stronger.
      #
      # The gap `go run pkg@version` leaves is that gitleaks is not a dependency of
      # this module, so nothing in this repo records the hash we expect: CI would be
      # trusting sum.golang.org at fetch time with no local anchor. Assert it here.
      # To bump: change the version, run the command, paste the new Sum.
      - name: Verify the gitleaks module hash
        run: |
          expected='h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w='
          actual=$(go mod download -json github.com/zricethezav/gitleaks/v8@v8.30.1 \
                   | grep '"Sum":' | head -1 | cut -d'"' -f4)
          if [ "$actual" != "$expected" ]; then
            echo "::error::gitleaks module hash mismatch"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "gitleaks v8.30.1 content hash verified: $actual"

      - name: gitleaks
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git \
            --no-banner -c .gitleaks.toml --log-opts="--all" --redact

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # `npm run test:e2e` builds the frontend, then `go build -o bin/decks
      # ./cmd/decks`, then runs Playwright against the real binary on port 19999.
      - name: Run e2e
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
