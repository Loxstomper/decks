name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag can never ship without a green suite.
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # web/dist is gitignored; only the .gitkeep placeholder is committed, which is
      # enough for //go:embed to compile. The frontend is not needed to run Go tests.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd/ internal/ web/)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # svelte-check, not tsc: bare tsc cannot resolve types exported from
      # <script module> in .svelte files and reports phantom errors.
      - run: npm run check
      - run: npx vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # `npm run test:e2e` builds the frontend, then `go build -o bin/decks
      # ./cmd/decks`, then runs Playwright against the real binary on port 19999.
      - name: Run e2e
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
